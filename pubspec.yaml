name: leya
description: App de alfabeto interativo com letras, sílabas e drawer estilo Duolingo.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: ComicSansMS
      fonts:
        - asset: assets/fonts/ComicSansMS.ttf
    - family: SystemUI
      fonts:
        - asset: assets/fonts/SegoeUI.ttf

  assets:
    - assets/icons/alphabet-icon.png
    - assets/icons/games-icon.png
    - assets/icons/videos-icon.png
    - assets/icons/menu-icon.svg
    - assets/icons/sun-icon.svg
    - assets/icons/moon-icon.svg
    - assets/icons/chevron-left.svg
    - assets/icons/chevron-right.svg
    - assets/icons/speaker-icon.svg
    - assets/audio/vowels/
    - assets/audio/consonants/
    - assets/audio/syllables/b/
